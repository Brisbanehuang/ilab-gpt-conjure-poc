services:
  image-studio:
    build:
      context: .
      dockerfile: Dockerfile.poc
    container_name: omniapi-image-studio-share
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OMNI_POC_MODE: ${OMNI_POC_MODE:-false}
      OMNI_BASE_URL: ${OMNI_BASE_URL:-http://host.docker.internal:8080/v1}
      OMNI_IMAGE_MODEL: ${OMNI_IMAGE_MODEL:-gpt-image-2}
      OMNI_POC_SECRET_KEY: ${OMNI_POC_SECRET_KEY:-}
      OMNI_POC_LOGIN_URL: ${OMNI_POC_LOGIN_URL:-}
      OMNI_POC_DASHBOARD_URL: ${OMNI_POC_DASHBOARD_URL:-}
      OMNI_POC_AUTH_ORIGINS: ${OMNI_POC_AUTH_ORIGINS:-}
      OMNI_POC_SOURCE_URL: ${OMNI_POC_SOURCE_URL:-https://github.com/Brisbanehuang/ilab-gpt-conjure-poc/tree/share/v0.2.25}
      OMNI_OBJECT_STORAGE_DRIVER: ${OMNI_OBJECT_STORAGE_DRIVER:-local}
    volumes:
      - ./data:/app/output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
